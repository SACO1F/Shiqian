<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>拾签 · 自动标签界面测试</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
      import { emit } from "@tauri-apps/api/event";
      import React from "react";
      import { createRoot } from "react-dom/client";
      import "/src/style.css";

      // Browser-only fixture: all records and credentials are synthetic; no desktop IPC.
      const ai = {
        model: "test-vision",
        reason: "图片中有几何图案",
        updatedAt: Date.now(),
        confirmed: false,
      };
      const tags = [
        {
          id: "folder",
          name: "设计素材",
          count: 220,
          version: 1,
          createdBy: "folder",
          source: "folder",
        },
        {
          id: "existing",
          name: "参考素材",
          count: 220,
          version: 1,
          createdBy: "manual",
          source: "ai",
          ai: { ...ai },
        },
        {
          id: "generated",
          name: "几何图案",
          count: 220,
          version: 1,
          createdBy: "ai",
          source: "ai",
          ai: { ...ai },
        },
      ];
      const files = Array.from({ length: 220 }, (_, i) => ({
        id: `f${i + 1}`,
        path: `C:/synthetic/设计素材/图案-${i + 1}.png`,
        parent: "C:/synthetic/设计素材",
        name: `图案-${i + 1}.png`,
        extension: "png",
        kind: "image",
        bytes: 4096,
        modified: Date.now(),
        added: Date.now() - i,
        status: "available",
        error: "",
        favorite: false,
        version: 1,
        note: "",
        noteVersion: 0,
        revision: "r1",
        identity: `i${i + 1}`,
        tags: structuredClone(tags),
        aiTask: { status: "done", error: "", updatedAt: Date.now() },
      }));
      let config = {
        enabled: false,
        endpoint: "",
        model: "",
        allowNewTags: true,
      };
      let hasKey = false;
      const settings = {
        theme: "light",
        views: { all: "grid" },
        details: true,
        galleryColumns: 3,
        folderAutoTagging: true,
      };
      const calls = [];
      const summary = () =>
        Object.fromEntries(
          [
            "queued",
            "running",
            "done",
            "failed",
            "unsupported",
            "cancelled",
          ].map((s) => [s, files.filter((f) => f.aiTask.status === s).length]),
        );
      const aiSettings = () => ({ config, hasKey, summary: summary() });
      const canvas = document.createElement("canvas");
      canvas.width = 400;
      canvas.height = 300;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#efe8d9";
      ctx.fillRect(0, 0, 400, 300);
      ctx.fillStyle = "#648779";
      ctx.beginPath();
      ctx.arc(200, 150, 92, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#d7b571";
      ctx.fillRect(215, 130, 115, 115);
      const pixels = canvas.toDataURL("image/png").split(",")[1];
      mockWindows("main");
      mockIPC(
        async (cmd, args) => {
          if (cmd !== "api") return null;
          const { action, payload: p } = args;
          calls.push({ action, payload: structuredClone(p) });
          switch (action) {
            case "bootstrap":
              return {
                tags,
                counts: {
                  all: 220,
                  inbox: 0,
                  favorites: 0,
                  recent: 220,
                  attention: 0,
                },
                settings: { ...settings, ai: config },
                dataPath: "C:/synthetic-test-library",
                version: "0.3.0-alpha.1",
                notice: "",
              };
            case "query": {
              const list = files.filter(
                (f) => !p.text || f.name.includes(p.text),
              );
              return {
                files: list.slice(p.offset, p.offset + Math.min(p.limit, 100)),
                offset: p.offset,
                total: list.length,
                hasMore: p.offset + Math.min(p.limit, 100) < list.length,
              };
            }
            case "preview":
              return { kind: "image", data: pixels, revision: "r1" };
            case "file":
              return files.find((f) => f.id === p.id);
            case "import.status":
              return null;
            case "ai.settings":
              return structuredClone(aiSettings());
            case "settings.save":
              settings[p.key] = p.value;
              await emit("library-changed");
              return { ok: true };
            case "folders.apply":
              return { changed: 4, total: 220 };
            case "ai.settings.save":
              config = structuredClone(p.config);
              hasKey = p.clearKey ? false : !!p.apiKey || hasKey;
              await emit("library-changed");
              return structuredClone(aiSettings());
            case "ai.test":
              return {
                ok: true,
                message: "连接成功；图片分析还需要该模型支持视觉输入",
              };
            case "ai.enqueue":
              for (const f of files.filter((f) => p.ids.includes(f.id)))
                f.aiTask = {
                  status: "queued",
                  error: "",
                  updatedAt: Date.now(),
                };
              await emit("library-changed");
              return { ok: true };
            case "ai.cancel":
              for (const f of files.filter((f) =>
                ["queued", "running"].includes(f.aiTask.status),
              ))
                f.aiTask.status = "cancelled";
              return { ok: true };
            case "ai.confirm": {
              const f = files.find((f) => f.id === p.id);
              f.tags.find((t) => t.id === p.tagId).ai.confirmed = true;
              f.version++;
              await emit("library-changed");
              return { ok: true };
            }
            default:
              throw Error(`Unmocked action: ${action}`);
          }
        },
        { shouldMockEvents: true },
      );
      window.qa = {
        calls,
        files,
        notify: () => emit("library-changed"),
        fail: (id) => {
          files.find((f) => f.id === id).aiTask = {
            status: "failed",
            error: "AI_NETWORK: 合成的连接失败",
            updatedAt: Date.now(),
          };
          return emit("library-changed");
        },
      };
      const { default: App } = await import("/src/App.tsx");
      createRoot(document.getElementById("root")).render(
        React.createElement(App),
      );
    </script>
  </body>
</html>
