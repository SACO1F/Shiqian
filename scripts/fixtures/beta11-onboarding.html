<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mockIPC, mockWindows } from "@tauri-apps/api/mocks";
      import { emit } from "@tauri-apps/api/event";
      import React from "react";
      import { createRoot } from "react-dom/client";
      import "/src/style.css";
      import "/src/apple-style.css";
      import "/src/tag-colors.css";
      import "/src/micro-interactions.css";
      import "/src/beta-support.css";
      import "/src/control-consistency.css";
      import "/src/beta8-controls.css";
      let settings = JSON.parse(
        localStorage.getItem("qa-settings") || "null",
      ) || {
        theme: "light",
        folderAutoTagging: true,
        ai: { enabled: false, endpoint: "", model: "", allowNewTags: true },
      };
      window.qaCalls = [];
      mockWindows("main");
      mockIPC(
        async (cmd, args) => {
          if (cmd !== "api") return null;
          const { action, payload: p } = args;
          window.qaCalls.push(action);
          const ai = () => ({
            config: structuredClone(settings.ai),
            hasKey: false,
            summary: {},
          });
          switch (action) {
            case "bootstrap":
              return {
                tags: [],
                counts: {
                  all: 0,
                  inbox: 0,
                  favorites: 0,
                  recent: 0,
                  attention: 0,
                },
                settings,
                dataPath: "C:/synthetic/beta12-onboarding",
                version: "0.3.0-beta.12",
                notice: "",
              };
            case "query":
              return { files: [], total: 0, offset: 0, hasMore: false };
          case "tasks.status":
            return { transfer: { busy: false, phase: "", bytes: 0, totalBytes: 0, completed: 0, fileTotal: 0, history: [] }, import: null, ai: {} };
            case "ai.settings":
              return ai();
            case "ai.settings.save":
              if (!/^https?:\/\//.test(p.config.endpoint))
                throw Error("AI_CONFIG: 请填写正确的服务地址");
              settings.ai = p.config;
              localStorage.setItem("qa-settings", JSON.stringify(settings));
              await emit("library-changed");
              return ai();
            case "settings.save":
              settings[p.key] = p.value;
              localStorage.setItem("qa-settings", JSON.stringify(settings));
              await emit("library-changed");
              return { ok: true };
            case "import.status":
              return null;
            case "package.status":
              return { busy: false, history: [] };
            default:
              return {};
          }
        },
        { shouldMockEvents: true },
      );
      const { default: App } = await import("/src/App.tsx");
      createRoot(document.getElementById("root")).render(
        React.createElement(App),
      );
    </script>
  </body>
</html>
